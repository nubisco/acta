<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Acta">
  <title>Acta</title>
  <defs>
    <linearGradient id="acta-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f45da"/>
      <stop offset="0.55" stop-color="#5c35c4"/>
      <stop offset="1" stop-color="#10a9a4"/>
    </linearGradient>
    <radialGradient id="acta-sheen" cx="0.28" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#acta-bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#acta-sheen)"/>

  <!-- Three lists filling up left to right: the board, and the progress
       through it. Reads as a board at 512 and as three bars at 16. -->
  <g fill="#ffffff">
    <rect x="112" y="150" width="76" height="62" rx="18" opacity="0.55"/>
    <rect x="218" y="150" width="76" height="62" rx="18" opacity="0.78"/>
    <rect x="324" y="150" width="76" height="62" rx="18"/>

    <rect x="112" y="234" width="76" height="62" rx="18" opacity="0.55"/>
    <rect x="218" y="234" width="76" height="62" rx="18" opacity="0.78"/>

    <rect x="112" y="318" width="76" height="62" rx="18" opacity="0.55"/>
  </g>

  <!-- The card that moved: the one fact the whole product is about. -->
  <path d="M330 300 l24 26 l50 -60" fill="none" stroke="#ffffff" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
