# Nubisco's hosted Acta instance (Workers + D1 + R2). Self-hosters use the
# Docker image instead; this file is for the Cloudflare deployment.
name = "acta"
main = "src/worker.ts"
compatibility_date = "2026-08-01"

routes = [{ pattern = "acta.nubisco.io", custom_domain = true }]

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "acta"
database_id = "cc20e5b0-6330-4c63-80a0-a173115dda0c"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "acta-attachments"

[vars]
ACTA_WORKSPACE = "Nubisco"
# What the sign-in button calls the provider. The name used to be hardcoded in
# the SPA, which told every self-hosted instance to sign in with a product its
# users have no account on; it now comes from here, so this instance has to say
# so explicitly.
ACTA_SSO_LABEL = "Nubisco Platform"
# Who notification digests come from. Not a secret, and it belongs here
# rather than in the code: this file is Nubisco's own deployment, and an
# address baked into an open-source product is the wrong sender on every
# instance of it that is not ours.
#
# The address already exists and is already a verified Resend sender: the
# corporate contact form sends as it. The product name in front of it is what
# tells a recipient which app is writing, so each product sets its own.
ACTA_EMAIL_FROM = "Acta <notifications@nubisco.io>"
# Where this instance lives, for every link that leaves it: the reminder
# emails' button and card links, and anything else built without a request
# to take an origin from. The cron sweep has no request at all, so without
# this the reminders went out with the button pointing at the relative path
# "/nubisco" and no card links (LA-361, reported by Ivan).
ACTA_BASE_URL = "https://acta.nubisco.io"
# Create a member on first SSO sign-in. Off by default since LA-397, because a
# provider token says who someone is, not which workspace is theirs. On here
# to keep this instance working exactly as before: it is safe ONLY while the
# Acta app on platform.nubisco.io has self-service signup OFF, so the platform
# mints a token for Nubisco people and nobody else. If self-service signup is
# ever enabled for this app, remove this line first and invite people instead.
ACTA_SSO_AUTO_PROVISION = "true"
# No ACTA_ADMIN_* here: identity comes from platform.nubisco.io via SSO, and
# the first person to sign in to a fresh workspace is made its admin. These
# remain supported, and are still required, for an instance running on email
# one-time codes alone, where there is no provider to vouch for anyone.

# The time-driven half of notifications: due dates arriving, and unread
# notifications going unread long enough to be worth an email. Five minutes
# against a shortest window of ten, so a reminder is at most half a window
# late. Both queries are indexed and return nothing almost every time.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# Request rate limits (LA-397), on Cloudflare's native limiter: counted at the
# edge, no storage operation per request. The numbers must match RATE_LIMITS in
# src/core/rateLimit.ts, which the in-process fallback uses and a test compares
# against this file. Periods can only be 10 or 60 seconds.
#
# namespace_id is per Cloudflare account, so Acta uses its own range (11xx)
# rather than sharing a counter with another Worker. The platform uses 1001 and
# 1002.
[[ratelimits]]
name = "ACTA_MCP_LIMITER"
namespace_id = "1101"

  [ratelimits.simple]
  limit = 240
  period = 60

[[ratelimits]]
name = "ACTA_WRITE_LIMITER"
namespace_id = "1102"

  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "ACTA_INGEST_LIMITER"
namespace_id = "1103"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "ACTA_OAUTH_REGISTER_LIMITER"
namespace_id = "1104"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "ACTA_AUTH_LIMITER"
namespace_id = "1105"

  [ratelimits.simple]
  limit = 20
  period = 60

[alias]
"bun:sqlite" = "./src/db/bun-sqlite-stub.ts"
# Link previews resolve a hostname before fetching it, which on Bun is
# node:dns. Workers has no resolver, and without this the bundler cannot
# resolve the specifier at all and the deploy fails to build. The stub throws,
# which is what makes safeFetch fall through to DNS-over-HTTPS there.
"node:dns/promises" = "./src/core/node-dns-stub.ts"

# Live updates: one Durable Object per workspace holds every open tab's
# socket, so a write handled by any instance (or the cron) reaches all of
# them at once. See src/live-hub.ts.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]
