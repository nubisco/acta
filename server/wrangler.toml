# Nubisco's hosted Acta instance (Workers + D1 + R2). Self-hosters use the
# Docker image instead; this file is for the Cloudflare deployment.
name = "acta"
main = "src/worker.ts"
compatibility_date = "2026-08-01"

routes = [{ pattern = "acta.nubisco.io", custom_domain = true }]

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "acta"
database_id = "cc20e5b0-6330-4c63-80a0-a173115dda0c"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "acta-attachments"

[vars]
ACTA_WORKSPACE = "Nubisco"
ACTA_ADMIN_EMAIL = "tools@nubisco.io"
ACTA_ADMIN_HANDLE = "jose"
ACTA_ADMIN_NAME = "José Silva"

[observability]
enabled = true

[alias]
"bun:sqlite" = "./src/db/bun-sqlite-stub.ts"
