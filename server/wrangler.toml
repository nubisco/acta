# Nubisco's hosted Acta instance (Workers + D1 + R2). Self-hosters use the
# Docker image instead; this file is for the Cloudflare deployment.
name = "acta"
main = "src/worker.ts"
compatibility_date = "2026-08-01"

routes = [{ pattern = "acta.nubisco.io", custom_domain = true }]

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "acta"
database_id = "cc20e5b0-6330-4c63-80a0-a173115dda0c"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "acta-attachments"

[vars]
ACTA_WORKSPACE = "Nubisco"
# What the sign-in button calls the provider. The name used to be hardcoded in
# the SPA, which told every self-hosted instance to sign in with a product its
# users have no account on; it now comes from here, so this instance has to say
# so explicitly.
ACTA_SSO_LABEL = "Nubisco Platform"
# No ACTA_ADMIN_* here: identity comes from platform.nubisco.io via SSO, and
# the first person to sign in to a fresh workspace is made its admin. These
# remain supported, and are still required, for an instance running on email
# one-time codes alone, where there is no provider to vouch for anyone.

[observability]
enabled = true

[alias]
"bun:sqlite" = "./src/db/bun-sqlite-stub.ts"
# Link previews resolve a hostname before fetching it, which on Bun is
# node:dns. Workers has no resolver, and without this the bundler cannot
# resolve the specifier at all and the deploy fails to build. The stub throws,
# which is what makes safeFetch fall through to DNS-over-HTTPS there.
"node:dns/promises" = "./src/core/node-dns-stub.ts"
