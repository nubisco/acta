name: Deploy

# Two independent outputs from one release: the Cloudflare Worker that serves
# acta.nubisco.io, and the GHCR image self-hosters run. The worker job used to
# be missing entirely, so every hosted deploy was done by hand from a laptop
# while CI reported success for having pushed an image.

on:
  workflow_run:
    workflows: [Release]
    branches: [master]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          path: acta

      - uses: actions/checkout@v6
        with:
          repository: nubisco/ui
          path: ui

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: acta/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Build @nubisco/ui
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies
        working-directory: acta
        run: pnpm install --frozen-lockfile

      # The image ships prebuilt artifacts (see Dockerfile): the SPA and a
      # single-file server bundle. Both are pure JS, so one build serves
      # every platform.
      - name: Build artifacts
        working-directory: acta
        run: |
          pnpm -C web build
          (cd server && bun build src/index.ts --target=bun --outdir=dist)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: version
        working-directory: acta
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: acta
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      # No `version:` here on purpose. package.json pins packageManager, and
      # naming a version as well makes the action refuse both.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The worker serves the SPA from the assets binding, so the deploy is
      # only as current as this build.
      - name: Build the app
        run: pnpm -C web build

      - name: Deploy worker
        # --var ACTA_BUILD_SHA is what lets GET /healthz answer "did my deploy
        # land?". Without it every instance reports "dev" and the endpoint
        # cannot tell a deploy that landed from one that silently did not.
        working-directory: server
        run: pnpm exec wrangler deploy --var ACTA_BUILD_SHA:${GITHUB_SHA::7}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
