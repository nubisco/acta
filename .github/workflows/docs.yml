name: Deploy Docs

# VitePress site published to GitHub Pages, following the same shape as cms,
# verba and stagewright: built on every push to master, plus manual dispatch.
#
# NOTE ON VISIBILITY: GitHub Pages is public. Everything under docs/ is
# world-readable once this runs, so docs/ must never carry a secret, an
# internal hostname that is not already public, or a customer's data. The
# examples in these pages use example.com deliberately.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The docs build needs vitepress and nothing else in the workspace, but
      # the lockfile covers the whole monorepo, so this installs all of it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress
        run: pnpm docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
