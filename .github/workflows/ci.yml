name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      # Dev consumes @nubisco/ui via a pnpm link to the sibling checkout, so
      # CI reproduces the same layout: build ui first, then the link resolves
      # exactly as it does locally.
      - uses: actions/checkout@v7
        with:
          path: acta

      - uses: actions/checkout@v7
        with:
          repository: nubisco/ui
          path: ui

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: acta/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Build @nubisco/ui
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies
        working-directory: acta
        run: pnpm install --frozen-lockfile

      - name: Quality gates (test, lint, format, types)
        working-directory: acta
        run: pnpm quality:check

      - name: Build
        working-directory: acta
        run: pnpm build
